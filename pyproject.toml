[project]
name = "gradle-healer"
version = "0.1.0"
description = "Autonomous LangGraph agent that generates and self-heals Kotlin/Android unit tests verified via Gradle"
readme = "README.md"
authors = [
    { name = "Ambrogio D'Alessandro", email = "dalessandro.ambro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["evals/fixtures", "playground"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.format]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["^evals/fixtures/", "^playground/"]

[tool.pytest.ini_options]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: tests that run real Gradle builds (excluded by default)"]
addopts = "-m 'not integration'"
