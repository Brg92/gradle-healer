# Record Gradle stdout/stderr fixtures across Linux, macOS and Windows.
#
# Used when Gradle or Kotlin versions change in the sandbox project:
# - triggered manually via `workflow_dispatch` once this file is on `main`, or
# - triggered on a pull request by adding the `record-logs` label (since GitHub
#   only enables `workflow_dispatch` for workflows present on the default branch).
#
# This workflow runs with read-only permissions and never commits: recorded
# logs are uploaded as workflow artifacts to be downloaded, inspected and
# committed locally.
name: Record Gradle Logs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'record-logs'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fixture_dir: linux
          - os: macos-latest
            fixture_dir: macos
          - os: windows-latest
            fixture_dir: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Gradle runs inside pytest on a tmp_path copy of the sandbox, so cache the
      # user home directly instead of relying on setup-gradle's default-branch writes.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('evals/fixtures/sandbox-jvm/**/*.gradle.kts', 'evals/fixtures/sandbox-jvm/gradle/wrapper/gradle-wrapper.properties', 'evals/fixtures/sandbox-jvm/gradle/*.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run integration tests and record logs
        env:
          GRADLE_HEALER_RECORD_LOGS: "1"
        run: uv run pytest -m integration -v
      - uses: actions/upload-artifact@v7
        with:
          name: gradle-logs-${{ matrix.os }}
          path: tests/fixtures/logs/${{ matrix.fixture_dir }}/*.txt
          if-no-files-found: error
