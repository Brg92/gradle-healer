name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not integration" -v

  integration:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Gradle runs inside pytest on a tmp_path copy of the sandbox, so cache the
      # user home directly instead of relying on setup-gradle's default-branch writes.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('evals/fixtures/sandbox-jvm/**/*.gradle.kts', 'evals/fixtures/sandbox-jvm/gradle/wrapper/gradle-wrapper.properties', 'evals/fixtures/sandbox-jvm/gradle/*.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m integration -v
